name: Web CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate pinned OpenAPI artifact and generated contract
        run: npm run openapi:check
      - name: Validate operational runbooks
        run: npm run operations:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate release gate scripts
        run: SMOKE_BASE_URL=http://127.0.0.1:3021 SMOKE_ENVIRONMENT=preview SMOKE_EXPECTED_SHA="$GITHUB_SHA" npm run release:preflight
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Validate universal-link manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/.well-known/apple-app-site-association'))"
          node -e "JSON.parse(require('fs').readFileSync('public/.well-known/assetlinks.json'))"
