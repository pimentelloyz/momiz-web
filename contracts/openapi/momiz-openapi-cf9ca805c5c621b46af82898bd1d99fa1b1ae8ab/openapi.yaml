      parameters:
        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                messageId: { type: string, format: uuid, nullable: true }
                category:
                  type: string
                  enum: [HARASSMENT, INAPPROPRIATE_CONTENT, PRIVACY_CONCERN, PROFESSIONAL_CONDUCT, SPAM, OTHER]
                details: { type: string, maxLength: 2000, nullable: true }
      responses:
        "201": { description: Denúncia registrada para análise administrativa }
        "403": { $ref: "#/components/responses/Forbidden" }
