                name: { type: string, minLength: 1, maxLength: 120 }
                relationshipIds:
                  type: array
                  minItems: 2
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "201": { description: Canal criado com consentimento explícito da paciente }
