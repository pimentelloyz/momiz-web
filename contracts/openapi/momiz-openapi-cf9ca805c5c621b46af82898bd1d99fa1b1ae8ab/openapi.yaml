components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CareProfileContextHeader:
      name: X-Momiz-Profile-Id
      in: header
      required: true
      description: UUID opaco do perfil de cuidado, revalidado no servidor e nunca derivado do JWT.
      schema: { type: string, format: uuid }
    PregnancyContextHeader:
      name: X-Momiz-Pregnancy-Id
      in: header
      required: true
      description: UUID opaco da gestação, revalidado no servidor em cada request contextual v2.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave opaca do cliente. Reutilização com payload diferente retorna IDEMPOTENCY_KEY_REUSED.
      schema: { type: string, minLength: 16, maxLength: 128 }
    PatientUserId:
      name: patientUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestPublicSession:
      name: X-Momiz-Guest-Session
      in: header
      required: false
      description: Token opaco emitido após aceitar o convite ou registrar o RSVP. Durante o rollout, guestId pode ser aceito quando a compatibilidade estiver habilitada.
      schema: { type: string, minLength: 40 }
    PlanningItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentTipId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventIdQuery:
      name: eventId
      in: query
      required: true
      schema: { type: string, format: uuid }
    GiftId:
      name: giftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContributionId:
      name: contributionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminUserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DemoId:
      name: demoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccessPackagePolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Sessão ausente, inválida ou expirada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sem permissão no recurso ou capacidade ausente no plano
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito de estado ou idempotência
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FeatureDisabled:
      description: Fundação MT-01 instalada, mas desabilitada por feature flag
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            message: Recurso temporariamente indisponível
            code: FEATURE_TEMPORARILY_DISABLED
            requestId: req_01
            error:
              code: FEATURE_TEMPORARILY_DISABLED
              message: Recurso temporariamente indisponível
  schemas:
    GuestParticipation:
      type: object
      required: [mode, adultCount, childrenCount, canChange, blockedReason]
      properties:
        mode: { type: [string, "null"], enum: [IN_PERSON, VIRTUAL, null] }
        adultCount: { type: integer, minimum: 0 }
        childrenCount: { type: integer, minimum: 0 }
        canChange: { type: boolean }
        blockedReason:
          type: [string, "null"]
          enum: [NOT_CONFIRMED, EVENT_INACTIVE, EVENT_ENDED, RSVP_DEADLINE_PASSED, HYBRID_DISABLED, null]
    GuestParticipationChange:
      type: object
      additionalProperties: false
      required: [participationMode, adultCount, childrenCount]
      properties:
        participationMode: { type: string, enum: [IN_PERSON, VIRTUAL] }
        adultCount: { type: integer, minimum: 0 }
        childrenCount: { type: integer, minimum: 0 }
    EventMembership:
      type: object
      required: [role, source, permissions]
      properties:
        role: { type: string, enum: [owner, guest] }
        source: { type: string, enum: [host, guest] }
        guestId: { type: [string, "null"], format: uuid }
        rsvpStatus: { type: [string, "null"], enum: [PENDING, CONFIRMED, DECLINED, MAYBE, null] }
        participation: { $ref: "#/components/schemas/GuestParticipation" }
        permissions: { type: object, additionalProperties: { type: boolean } }
    EventMembershipItem:
      type: object
      required: [id, active, membership]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        eventDateTime: { type: string, format: date-time }
        timezone: { type: string }
        coverImageUrl: { type: [string, "null"] }
        active: { type: boolean }
        membership: { $ref: "#/components/schemas/EventMembership" }
    EventMembershipList:
      type: object
      required: [defaultEventId, ownedEvents, guestEvents, total]
      properties:
        defaultEventId: { type: [string, "null"], format: uuid }
        ownedEvents: { type: array, items: { $ref: "#/components/schemas/EventMembershipItem" } }
        guestEvents: { type: array, items: { $ref: "#/components/schemas/EventMembershipItem" } }
        total: { type: integer, minimum: 0 }
    CareNotificationCategory:
      type: string
      enum: [INVITATION, RELATIONSHIP, APPOINTMENT, REMINDER, DOCUMENT, MESSAGE, LABOR]
    CareNotificationPreference:
      type: object
      required: [category, channel, enabled]
      additionalProperties: false
      properties:
        category: { $ref: "#/components/schemas/CareNotificationCategory" }
        channel: { type: string, enum: [IN_APP, PUSH] }
        enabled: { type: boolean }
    CareNotificationPreferencesUpdate:
      type: object
      required: [expectedVersion, preferences]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        preferences:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/CareNotificationPreference" }
    CareMessageSendV2:
      type: object
      required: [clientMessageId, content]
      additionalProperties: false
      properties:
        clientMessageId: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 5000 }
    CareAppointmentSlotV2:
      type: object
      required: [startsAt, endAt, timezone, modality]
      properties:
        startsAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        timezone: { type: string, maxLength: 64 }
        modality: { type: string, enum: [IN_PERSON, REMOTE, HYBRID] }
        location: { type: [string, "null"] }
        meetingUrl: { type: [string, "null"], format: uri }
    CareAppointmentCreateV2:
      allOf:
        - { $ref: "#/components/schemas/CareAppointmentSlotV2" }
        - type: object
          required: [type, title]
          properties:
            relationshipId: { type: string, format: uuid }
            responsibleProfessionalProfileId: { type: string, format: uuid }
            type: { type: string, enum: [CONSULTATION, EXAM, VACCINE, PHYSIOTHERAPY, DOULA_MEETING, OTHER] }
            title: { type: string, minLength: 1, maxLength: 160 }
    CareAppointmentResponseV2:
      type: object
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [ACCEPT, DECLINE] }
        expectedVersion: { type: integer, minimum: 1 }
    CareAppointmentVersionV2:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }
    CareProfileType:
      type: string
      enum: [PATIENT, PROFESSIONAL, COMPANION]
    CareProfileStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    PregnancyStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CareContextAccessKind:
      type: string
      enum: [OWNER, COMPANION_MEMBERSHIP, PROFESSIONAL_RELATIONSHIP]
    CareProfileContext:
      type: object
      additionalProperties: false
      required: [pregnancyId, accessKind, status]
      properties:
        pregnancyId: { type: string, format: uuid }
        accessKind: { $ref: "#/components/schemas/CareContextAccessKind" }
        status: { $ref: "#/components/schemas/PregnancyStatus" }
    CareProfessionalProfileSummary:
      type: object
      additionalProperties: false
      required: [professionalProfileId, verificationStatus]
      properties:
        professionalProfileId: { type: string, format: uuid }
        verificationStatus: { type: string }
    CareProfile:
      type: object
      additionalProperties: false
      required: [id, type, status, version, professional, contexts]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/CareProfileType" }
        status: { $ref: "#/components/schemas/CareProfileStatus" }
        version: { type: integer, minimum: 1 }
        professional:
          oneOf:
            - $ref: "#/components/schemas/CareProfessionalProfileSummary"
            - type: "null"
        contexts:
          type: array
          items: { $ref: "#/components/schemas/CareProfileContext" }
    CareProfilesResponse:
      type: object
      additionalProperties: false
      required: [profiles, requestId]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/CareProfile" }
        requestId: { type: string }
    ResolveCareContextRequest:
      type: object
      additionalProperties: false
      required: [profileId, pregnancyId, expectedProfileVersion]
      properties:
        profileId: { type: string, format: uuid }
        pregnancyId: { type: string, format: uuid }
        expectedProfileVersion: { type: integer, minimum: 1 }
    ResolvedCareContext:
      type: object
      additionalProperties: false
      required: [profileId, profileType, profileVersion, pregnancyId, pregnancyVersion, accessKind, membershipId, relationshipId]
      properties:
        profileId: { type: string, format: uuid }
        profileType: { $ref: "#/components/schemas/CareProfileType" }
        profileVersion: { type: integer, minimum: 1 }
        pregnancyId: { type: string, format: uuid }
        pregnancyVersion: { type: integer, minimum: 1 }
        accessKind: { $ref: "#/components/schemas/CareContextAccessKind" }
        membershipId: { type: [string, "null"], format: uuid }
        relationshipId: { type: [string, "null"], format: uuid }
    ResolveCareContextResponse:
      type: object
      additionalProperties: false
      required: [context, requestId]
      properties:
        context: { $ref: "#/components/schemas/ResolvedCareContext" }
        requestId: { type: string }
    CreateCarePregnancyRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId: { type: string, format: uuid }
    CarePregnancy:
      type: object
      additionalProperties: false
      required: [id, version, status, ownerProfileId, membershipId]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE] }
        ownerProfileId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
    CreateCarePregnancyResponse:
      type: object
      additionalProperties: false
      required: [pregnancy, requestId]
      properties:
        pregnancy: { $ref: "#/components/schemas/CarePregnancy" }
        requestId: { type: string }
    CareInvitationDirection:
      type: string
      enum: [PATIENT_TO_PROFESSIONAL, PROFESSIONAL_TO_PATIENT]
    CreateCareInvitationV2Request:
      type: object
      additionalProperties: false
      required: [direction, issuerProfileId, expectedProfession]
      properties:
        direction: { $ref: "#/components/schemas/CareInvitationDirection" }
        issuerProfileId: { type: string, format: uuid }
        recipientProfileId: { type: string, format: uuid }
        recipient: { type: object, additionalProperties: false, properties: { email: { type: string, format: email } } }
        expectedProfession: { type: string }
