      tags: [Care]
      operationId: createCareTeamMessage
      description: Envia mensagem sem anexos; use documentos compartilhados para arquivos clínicos.
      parameters:
        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
                mentionedRelationshipIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
