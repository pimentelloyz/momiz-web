openapi: 3.1.0
info:
  title: Momiz Core API
  version: 1.0.0
  description: Contrato versionado da jornada principal de chá, convidados e presentes.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Events
  - name: Guests
  - name: Gifts
  - name: Account
  - name: Billing
  - name: Legal
  - name: Content
  - name: Telemetry
  - name: Care
  - name: ProfessionalCare
paths:
  /public/deep-link-handoffs:
    post:
      tags: [Events]
      operationId: createDeepLinkHandoff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, platformHint]
              properties:
                target:
                  type: object
                  required: [type, slug]
                  properties:
                    type: { type: string, enum: [EVENT_INVITE] }
                    slug: { type: string, minLength: 1, maxLength: 160 }
                    guestId: { type: string, format: uuid }
                platformHint: { type: string, enum: [ANDROID, IOS, UNKNOWN] }
      responses:
        "201":
          description: Handoff temporário criado; o token só é retornado nesta resposta
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "404": { description: Evento ativo ou convidado pertencente ao evento não encontrado }
        "429": { description: Limite de mutações públicas excedido }
  /public/deep-link-handoffs/resolve:
    post:
      tags: [Events]
      operationId: resolveDeepLinkHandoff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, installationId, platform]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                installationId: { type: string, minLength: 8, maxLength: 256 }
                platform: { type: string, enum: [ANDROID, IOS] }
      responses:
        "200":
          description: Destino resolvido e handoff consumido; repetição pela mesma instalação é idempotente por 15 minutos
          content:
            application/json:
              schema:
                type: object
                required: [target, consumed]
                properties:
                  target:
                    type: object
                    required: [type, canonicalUrl]
                    properties:
                      type: { type: string, enum: [EVENT_INVITE] }
                      canonicalUrl: { type: string, format: uri }
                  consumed: { type: boolean, const: true }
        "404": { description: HANDOFF_NOT_FOUND }
        "410": { description: HANDOFF_EXPIRED ou HANDOFF_ALREADY_CONSUMED }
        "429": { description: Limite de mutações públicas excedido }
  /telemetry/events:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        "202": { description: Evento permitido, sanitizado e aceito }
        "400":
          description: Requisição inválida, inclusive PIX_DATA_RESPONSIBILITY_REQUIRED quando a criação com Pix não contém aceite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /telemetry/summary:
    get:
      tags: [Telemetry]
      operationId: getTelemetrySummary
      summary: Consolida funis e alertas sem dados pessoais ou financeiros
      parameters:
        - name: windowMinutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 10080, default: 1440 }
        - name: X-Momiz-Ops-Token
          in: header
          description: Alternativa operacional à autenticação de administrador
          schema: { type: string }
      responses:
        "200":
          description: Resumo operacional
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetrySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      responses:
        "200":
          description: Eventos do usuário
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
    post:
      tags: [Events]
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvent" }
      responses:
        "201":
          description: Evento criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Plano sem a capacidade event.create (ACCOUNT_CAPABILITY_REQUIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Conflito, inclusive PIX_DATA_RESPONSIBILITY_VERSION_OUTDATED quando a versão do aceite não é a vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /events/creation-draft:
    get:
      tags: [Events]
      operationId: getEventCreationDraft
      summary: Recupera o rascunho ativo do wizard do usuário
      responses:
        "200":
          description: Rascunho atual ou null quando não existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft:
                    oneOf:
                      - $ref: "#/components/schemas/EventCreationDraft"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Events]
      operationId: saveEventCreationDraft
      summary: Cria ou atualiza o checkpoint do wizard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentStep, payload]
              properties:
                currentStep: { type: integer, minimum: 0, maximum: 5 }
                payload: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Checkpoint salvo
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/EventCreationDraft" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Events]
      operationId: clearEventCreationDraft
      summary: Descarta o rascunho ativo do usuário
      responses:
        "204": { description: Rascunho removido }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events/memberships:
    get:
      tags: [Events]
      operationId: listMyEventMemberships
      summary: Lista eventos e memberships do usuário autenticado
      responses:
        "200":
          description: Memberships do usuário, com participação para convidados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventMembershipList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events/{eventId}/me/participation:
    parameters:
      - $ref: "#/components/parameters/EventId"
    patch:
      tags: [Events, Guests]
      operationId: changeMyGuestParticipation
      summary: Altera o formato de participação do próprio convidado autenticado
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          example: participation-attempt-550e8400-e29b-41d4-a716
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestParticipationChange" }
            example: { participationMode: IN_PERSON, adultCount: 1, childrenCount: 0 }
      responses:
        "200":
          description: Participação vigente, inclusive em replay idempotente
          content:
            application/json:
              schema:
                type: object
                required: [participation]
                properties:
                  participation: { $ref: "#/components/schemas/GuestParticipation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEvent
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Events]
      operationId: updateEvent
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 16, maxLength: 128 } }
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEvent" }
      responses:
        "200":
          description: Evento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventUpdateResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400":
          description: Requisição inválida, inclusive PIX_DATA_RESPONSIBILITY_REQUIRED quando a alteração Pix exige aceite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Conflito, inclusive PIX_DATA_RESPONSIBILITY_VERSION_OUTDATED quando a versão do aceite não é a vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Events]
      operationId: deleteEvent
      responses:
        "204": { description: Evento removido }
  /events/{eventId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEventDashboard
      responses:
        "200":
          description: Detalhes privados do organizador
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetails" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/{eventId}/details:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEventDetails
      summary: Retorna detalhes do evento para um membro autenticado
      responses:
        "200":
          description: Detalhes do evento com endereço conforme a permissão do membro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{eventId}/readiness:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEventReadiness
      summary: Retorna a prontidão de configuração do evento
      responses:
        "200":
          description: Etapas obrigatórias e opcionais da configuração
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventReadiness" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/{eventId}/planning:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      operationId: getEventPlanning
      responses:
        "200":
          description: Checklist, orçamento e totais privados do evento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPlanning" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{eventId}/checklist-items:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      operationId: createEventChecklistItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ChecklistItemWrite"
                - type: object
                  required: [title]
      responses:
        "201":
          description: Item criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /events/{eventId}/checklist-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PlanningItemId"
    patch:
      tags: [Events]
      operationId: updateEventChecklistItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistItemWrite" }
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Events]
      operationId: deleteEventChecklistItem
      responses:
        "204": { description: Item removido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{eventId}/budget-items:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Events]
      operationId: createEventBudgetItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BudgetItemWrite"
                - type: object
                  required: [category, description, plannedAmount]
      responses:
        "201":
          description: Despesa criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/{eventId}/budget-items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/PlanningItemId"
    patch:
      tags: [Events]
      operationId: updateEventBudgetItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetItemWrite" }
      responses:
        "200":
          description: Despesa atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Events]
      operationId: deleteEventBudgetItem
      responses:
        "204": { description: Despesa removida }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/by-slug/{slug}/details:
    get:
      tags: [Events]
      operationId: getPublicEventBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
        - name: guestId
          in: query
          description: Identificador aceito apenas durante a janela de compatibilidade de links antigos.
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/GuestPublicSession"
      responses:
        "200":
          description: Landing pública, com endereço possivelmente redigido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetails" }
  /guests:
    get:
      tags: [Guests]
      operationId: listGuests
      parameters:
        - $ref: "#/components/parameters/EventIdQuery"
      responses:
        "200":
          description: Convidados do evento
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Guest" }
    post:
      tags: [Guests]
      operationId: createGuest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuest" }
      responses:
        "201":
          description: Convidado criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /guests/import:
    post:
      tags: [Guests]
      operationId: importGuests
      summary: Importa contatos como convidados em uma única transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, guests]
              properties:
                eventId: { type: string, format: uuid }
                guests:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ImportGuest" }
      responses:
        "201":
          description: Contatos importados
          content:
            application/json:
              schema:
                type: object
                required: [created, count]
                properties:
                  created:
                    type: array
                    items: { $ref: "#/components/schemas/Guest" }
                  count: { type: integer, minimum: 1 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /guests/rsvp:
    post:
      tags: [Guests]
      security: []
      operationId: submitPublicGuestRsvp
      parameters:
        - $ref: "#/components/parameters/GuestPublicSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: "^[a-z0-9-]+$" }
                guestId: { type: string, format: uuid }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                rsvpStatus:
                  type: string
                  enum: [CONFIRMED, DECLINED, MAYBE]
                participationMode:
                  type: string
                  enum: [IN_PERSON, VIRTUAL]
                guestCount:
                  type: integer
                  minimum: 0
                  description: Total informado na resposta. O consumo do plano preserva ao menos uma pessoa por convite ativo e inclui acompanhantes.
                adultCount: { type: integer, minimum: 0 }
                childrenCount: { type: integer, minimum: 0 }
      responses:
        "200":
          description: RSVP persistido e sessão pública rotacionada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /public/events/{slug}/access-code:
    post:
      tags: [Guests]
      security: []
      operationId: generatePublicAccessCode
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
        - $ref: "#/components/parameters/GuestPublicSession"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                guestId: { type: string, format: uuid }
                reservationId: { type: string, format: uuid }
                ttlHours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "201": { description: Código opaco de uso único criado }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /public/access-code/accept:
    post:
      tags: [Guests]
      security: []
      operationId: acceptPublicAccessCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 16 }
      responses:
        "200":
          description: Código consumido e sessão pública emitida
          content:
            application/json:
              schema:
                type: object
                required: [accepted, event, acceptedAt]
                properties:
                  accepted: { type: boolean, const: true }
                  event: { $ref: "#/components/schemas/Event" }
                  guest:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/Guest"
                  publicSession:
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/GuestPublicSession"
                  acceptedAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /public/events/{eventId}/gift-cart:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/GuestPublicSession"
    get:
      tags: [Gifts]
      security: []
      operationId: getGuestGiftCart
      parameters:
        - in: query
          name: guestId
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Carrinho ativo do convidado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCart" }
  /public/events/{eventId}/gift-cart/items:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/GuestPublicSession"
    post:
      tags: [Gifts]
      security: []
      operationId: addGiftCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId]
              properties:
                guestId: { type: string, format: uuid }
                giftId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Carrinho atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCart" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /public/events/{eventId}/gift-cart/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/GuestPublicSession"
      - in: path
        name: itemId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Gifts]
      security: []
      operationId: updateGiftCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                guestId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Carrinho atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCart" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Gifts]
      security: []
      operationId: removeGiftCartItem
      parameters:
        - in: query
          name: guestId
          required: false
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Item removido }
        "403": { $ref: "#/components/responses/Forbidden" }
  /public/events/{eventId}/gift-cart/checkout:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/GuestPublicSession"
    post:
      tags: [Gifts]
      security: []
      operationId: checkoutGiftCart
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                guestId: { type: string, format: uuid }
                mode: { type: string, enum: [PHYSICAL, PIX, SHIP_TO_HOST] }
                pixAmount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000
                  description: Valor escolhido pelo convidado quando algum item não possui valor de referência.
      responses:
        "201":
          description: Checkout criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftCheckout" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /public/events/{eventId}/gift-cart/checkout/preview:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/GuestPublicSession"
