                  maxItems: 3
                  items:
                    type: object
                    required: [type, version]
                    properties:
                      type:
                        type: string
                        enum: [TERMS_OF_USE, PRIVACY_POLICY, HEALTH_DATA]
                      version: { type: string }
                      source: { type: string, maxLength: 40 }
      responses:
        "200": { description: Aceites versionados registrados }
        "409": { $ref: "#/components/responses/Conflict" }
  /account/consents/{type}:
    delete:
      tags: [Account]
      operationId: revokeConsent
