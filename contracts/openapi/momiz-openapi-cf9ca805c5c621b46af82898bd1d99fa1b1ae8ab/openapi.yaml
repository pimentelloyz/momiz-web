        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Mensagens autorizadas do relacionamento }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Care]
      operationId: createCareMessage
      description: Envia mensagem enquanto o relacionamento estiver ativo.
      parameters:
        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201": { description: Mensagem enviada e notificação neutra enfileirada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Relacionamento não está ativo }
  /care/patients/{patientUserId}/relationships/{relationshipId}/messages/read:
    patch:
      tags: [Care]
      operationId: markCareMessagesRead
      parameters:
        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Leituras do participante registradas }
        "403": { $ref: "#/components/responses/Forbidden" }
  /care/patients/{patientUserId}/relationships/{relationshipId}/reports:
    post:
      tags: [Care]
      operationId: reportCareCommunication
