    patch:
      tags: [ProfessionalCare]
      operationId: updateProfessionalClinicMember
      parameters:
        - { name: clinicId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, reactivate, transferOwnership] }
      responses:
        "200": { description: Estado do membro atualizado ou propriedade transferida pelo proprietário atual }
