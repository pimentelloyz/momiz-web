      responses:
        "201": { description: Evento clínico ou de apoio registrado }
  /care/patients/{patientUserId}/physio:
    get:
      tags: [Care]
      operationId: listPhysioWorkspace
      parameters: [{ $ref: "#/components/parameters/PatientUserId" }]
      responses:
        "200": { description: Planos e sessões de fisioterapia autorizados }
