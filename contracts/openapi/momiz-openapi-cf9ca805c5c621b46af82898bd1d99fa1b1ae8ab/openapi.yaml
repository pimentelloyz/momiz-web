  /admin/access/package-policies/history:
    get:
      tags: [Account]
      operationId: adminListAccessPackagePolicyHistory
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50 },
          }
      responses:
        "200": { description: Histórico paginado de políticas publicadas }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/access/package-policies/drafts:
    post:
      tags: [Account]
      operationId: adminCreateAccessPackagePolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                sourceVersion: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Rascunho criado a partir de uma versão existente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPackagePolicy" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/access/package-policies/drafts/{policyId}:
    put:
      tags: [Account]
      operationId: adminUpdateAccessPackagePolicyDraft
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, packages]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                packages: { $ref: "#/components/schemas/AccessPackageMatrix" }
      responses:
        "200":
          description: Rascunho atualizado e auditado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPackagePolicy" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Account]
      operationId: adminDiscardAccessPackagePolicyDraft
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      responses:
        "204": { description: Rascunho descartado e auditado }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/access/package-policies/drafts/{policyId}/validate:
    post:
      tags: [Account]
      operationId: adminValidateAccessPackagePolicyDraft
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      responses:
        "200": { description: Erros e avisos da matriz do rascunho }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/access/package-policies/drafts/{policyId}/publish:
    post:
      tags: [Account]
      operationId: adminPublishAccessPackagePolicyDraft
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedPublishedVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                expectedPublishedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Política publicada atomicamente e cache invalidado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPackagePolicy" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/access/package-policies/{policyId}/diff:
    get:
      tags: [Account]
      operationId: adminGetAccessPackagePolicyDiff
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      responses:
        "200": { description: Diferenças em relação à versão-base }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/access/package-policies/{policyId}/impact-preview:
    get:
      tags: [Account]
      operationId: adminPreviewAccessPackagePolicyImpact
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      responses:
        "200":
          description: Contas e usos que excederiam os novos limites
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/access/package-policies/{policyId}:
    get:
      tags: [Account]
      operationId: adminGetAccessPackagePolicy
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      responses:
        "200":
          description: Versão completa da política, incluindo rascunhos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPackagePolicy" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/access/package-policies/{policyId}/clone:
    post:
      tags: [Account]
      operationId: adminCloneAccessPackagePolicy
      parameters:
        - $ref: "#/components/parameters/AccessPackagePolicyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Nova versão em rascunho criada para rollback seguro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPackagePolicy" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /account/capabilities:
    get:
      tags: [Account]
      operationId: getAccountCapabilities
      responses:
        "200":
          description: Capacidades e limites efetivos da conta autenticada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCapabilities" }
  /account/upgrade-prompts:
    get:
      tags: [Account]
      operationId: getAccountUpgradePrompts
      parameters:
        - name: surface
          in: query
          required: true
          schema: { type: string, enum: [HOME_NO_EVENT, HOME_ORGANIZER, HOME_POST_CREATE, PLANNING_CHECKLIST, PLANNING_BUDGET, GIFTS_LIST, GIFT_FORM, EVENT_EDIT, EVENT_WIZARD_PIX, EVENT_WIZARD_COLLECTIVE, GUESTS, COHOSTS, PROFESSIONAL_CARE, ACCOUNT_PLAN] }
        - { name: sourceComponent, in: query, schema: { type: string, pattern: '^[A-Z0-9_]{1,64}$' } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: profileId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: No máximo um prompt server-driven; vazio em fail-closed
          content: { application/json: { schema: { $ref: "#/components/schemas/UpgradePromptsResponse" } } }
        "304": { description: Política não alterada }
        "404": { $ref: "#/components/responses/NotFound" }
  /account/care-profiles:
    get:
      tags: [Account]
      operationId: listCareProfiles
      summary: Lista perfis de cuidado e contextos selecionáveis da conta
      description: Contrato MT-01. O gate retorna FEATURE_TEMPORARILY_DISABLED enquanto CARE_CONTEXTS_READ_ENABLED=false.
      responses:
        "200":
          description: Perfis próprios e contextos minimizados; nenhum dado clínico é retornado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareProfilesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /account/care-context/resolve:
    post:
      tags: [Account]
      operationId: resolveCareContext
      summary: Valida um contexto explícito sem persistir seleção ou alterar o JWT
      description: Contrato MT-01. Operação idempotente e indisponível enquanto CARE_CONTEXTS_READ_ENABLED=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveCareContextRequest" }
      responses:
        "200":
          description: Contexto validado para a conta autenticada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveCareContextResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /account/editable-event:
    put:
      tags: [Account]
      operationId: selectEditableEvent
      summary: Escolhe o chá que continuará editável após redução do limite
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId: { type: string, format: uuid }
      responses:
        "200":
          description: Seleção persistida e snapshot atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCapabilities" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /billing/products:
    get:
      tags: [Billing]
      operationId: listBillingProducts
      summary: Lista os identificadores de produtos configurados nas lojas
      description: Preços e moedas devem ser obtidos diretamente da Apple ou Google pelo cliente.
      responses:
        "200":
          description: Catálogo de assinaturas disponível para a plataforma
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/BillingProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /billing/plans:
    get:
      tags: [Billing]
      operationId: listAccessPlans
      security: []
      summary: Apresenta os planos conforme a política de acesso publicada
      description: Os preços continuam sendo obtidos diretamente da Apple ou Google pelo cliente.
      responses:
        "200":
          description: Catálogo comercial alinhado à versão efetiva de capacidades
          content:
            application/json:
              schema:
                type: object
                required: [catalogVersion, plans]
                properties:
                  catalogVersion: { type: integer, minimum: 1 }
                  publishedAt: { type: [string, "null"], format: date-time }
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/AccessPlanPresentation" }
  /billing/subscription:
    get:
      tags: [Billing]
      operationId: getCurrentSubscription
      summary: Retorna a assinatura mais relevante da conta autenticada
      responses:
        "200":
          description: Assinatura atual ou null quando nunca houve assinatura
          content:
            application/json:
              schema:
                type: object
                required: [subscription]
                properties:
                  subscription:
                    oneOf:
                      - { $ref: "#/components/schemas/CurrentSubscription" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /billing/purchases/apple:
    post:
      tags: [Billing]
      operationId: verifyAppleSubscriptionPurchase
      summary: Valida uma transação assinada pela Apple e sincroniza o acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedTransaction]
              properties:
                signedTransaction:
                  { type: string, minLength: 40, maxLength: 50000 }
      responses:
        "200":
          { description: Compra verificada e sincronizada de forma idempotente }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/purchases/google:
    post:
      tags: [Billing]
      operationId: verifyGoogleSubscriptionPurchase
      summary: Consulta a compra no Google Play e sincroniza o acesso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseToken, productId]
              properties:
                purchaseToken: { type: string, minLength: 10, maxLength: 5000 }
                productId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          { description: Compra verificada e sincronizada de forma idempotente }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/webhooks/apple:
    post:
      tags: [Billing]
      operationId: processAppleServerNotificationV2
      security: []
      summary: Valida e processa uma App Store Server Notification V2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  { type: string, minLength: 40, maxLength: 100000 }
      responses:
        "204": { description: Notificação processada ou ignorada com segurança }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/restore/apple:
    post:
      tags: [Billing]
      operationId: restoreAppleSubscriptions
      summary: Restaura transações Apple após validar todo o lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchases]
              properties:
                purchases:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [signedTransaction]
                    properties:
                      signedTransaction:
                        { type: string, minLength: 40, maxLength: 50000 }
      responses:
        "200": { description: Resultado sanitizado do restore }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/restore/google:
    post:
      tags: [Billing]
      operationId: restoreGoogleSubscriptions
      summary: Restaura compras Google após consultar a loja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchases]
              properties:
                purchases:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [purchaseToken, productId]
                    properties:
                      purchaseToken:
                        { type: string, minLength: 10, maxLength: 5000 }
                      productId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: Resultado sanitizado do restore }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/webhooks/google-rtdn:
    post:
      tags: [Billing]
      operationId: processGoogleRealTimeDeveloperNotification
      security: []
      summary: Autentica o push Pub/Sub e revalida a assinatura no Google Play
      responses:
        "204": { description: RTDN processada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /account/export:
    get:
      tags: [Account]
      operationId: exportAccountData
      responses:
        "200":
          description: Exportação JSON dos dados vinculados ao titular
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object }
  /account:
    delete:
      tags: [Account]
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, const: EXCLUIR }
      responses:
        "200":
          description: Conta removida e participações externas anonimizadas
        "400": { $ref: "#/components/responses/ValidationError" }
  /account/consents:
    get:
      tags: [Account]
      operationId: listConsents
      responses:
        "200": { description: Versões exigidas e histórico de consentimentos }
    post:
      tags: [Account]
      operationId: acceptConsents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents:
                  type: array
