        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfessionalProfileInput" }
      responses:
        "200": { description: Cadastro profissional salvo }
        "422": { $ref: "#/components/responses/ValidationError" }
  /care/professional/terms:
    get:
      tags: [ProfessionalCare]
      operationId: getCurrentProfessionalTerms
      security: []
