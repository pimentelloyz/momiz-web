    get:
      tags: [Care]
      operationId: listCareTeamMessages
      parameters:
        - { $ref: "#/components/parameters/PatientUserId" }
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Histórico do canal autorizado }
        "404": { description: Canal não encontrado para o participante }
