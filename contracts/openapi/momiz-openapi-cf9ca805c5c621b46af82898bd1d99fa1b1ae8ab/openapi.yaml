    post:
      tags: [Care]
      operationId: createCarePregnancy
      summary: Cria um contexto de gestação e membership owner atomicamente
      description: Contrato MT-01. O gate retorna FEATURE_TEMPORARILY_DISABLED enquanto CARE_CONTEXTS_WRITE_ENABLED ou CARE_CONTEXTS_V2_ROUTES_ENABLED estiver false.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCarePregnancyRequest" }
      responses:
        "201":
          description: Gestação e membership owner criados, ou resultado anterior da mesma chave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateCarePregnancyResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /care/v2/pregnancies/{pregnancyId}/invitations:
    post:
      tags: [ProfessionalCare]
      operationId: createCareInvitationV2
      parameters:
        - { name: pregnancyId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCareInvitationV2Request" } } } }
      responses:
        "201": { description: Convite criado }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/FeatureDisabled" }
  /care/v2/invitations/resolve:
    post:
      tags: [ProfessionalCare]
      operationId: resolveCareInvitationV2
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, minLength: 32, maxLength: 128 } } } } } }
