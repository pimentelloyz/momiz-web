        readiness: { $ref: "#/components/schemas/EventReadiness" }
        advancedAnalyticsAvailable: { type: boolean }
        conversionReport:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/EventConversionReport"
        checkoutSummary:
          type: object
          properties:
            total: { type: integer }
            pix: { type: integer }
            physical: { type: integer }
            awaitingPayment: { type: integer }
            underReview: { type: integer }
            physicalPendingReceipt: { type: integer }
            received: { type: integer }
    EventConversionReport:
      type: object
      properties:
        invitations:
          type: object
          properties:
            total: { type: integer }
            shared: { type: integer }
            shareRate: { type: number, minimum: 0, maximum: 1 }
        rsvp:
          type: object
          properties:
            total: { type: integer }
            responded: { type: integer }
            confirmed: { type: integer }
            confirmedPeople: { type: integer }
            responseRate: { type: number, minimum: 0, maximum: 1 }
            confirmationRate: { type: number, minimum: 0, maximum: 1 }
        gifts:
          type: object
          properties:
            total: { type: integer }
            engaged: { type: integer }
            received: { type: integer }
            thankYouPending: { type: integer }
            engagementRate: { type: number, minimum: 0, maximum: 1 }
            intentions: { type: integer }
            receivedCheckouts: { type: integer }
            awaitingPayment: { type: integer }
            underReview: { type: integer }
            physicalPendingReceipt: { type: integer }
    EventHost:
      type: object
      properties:
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
    EventDashboardMetric:
      type: object
      required: [title, value, subtitle, unavailable]
      properties:
        title: { type: string }
        value: { type: string }
        subtitle: { type: string }
        progress: { type: [number, "null"] }
        unavailable: { type: boolean }
    EventDashboardAction:
      type: object
      required: [type, title, subtitle]
      properties:
        type: { type: string }
        title: { type: string }
        subtitle: { type: string }
    EventDashboard:
      type: object
      required:
        [
          rsvpMetric,
          giftsMetric,
          diapersMetric,
          countdownMetric,
          nextActions,
          overallProgress,
        ]
      properties:
        rsvpMetric: { $ref: "#/components/schemas/EventDashboardMetric" }
        giftsMetric: { $ref: "#/components/schemas/EventDashboardMetric" }
        diapersMetric: { $ref: "#/components/schemas/EventDashboardMetric" }
        countdownMetric: { $ref: "#/components/schemas/EventDashboardMetric" }
        nextActions:
          type: array
          items: { $ref: "#/components/schemas/EventDashboardAction" }
        overallProgress: { type: number }
    EventReadinessStep:
      type: object
      required: [key, status, required, priority, title, subtitle, route]
      properties:
        key:
          type: string
          enum:
            [EVENT_DETAILS, INVITATION, LOCATION, GUESTS, GIFTS, DIAPER_GOALS]
        status: { type: string, enum: [PENDING, COMPLETED] }
        required: { type: boolean }
        priority: { type: integer, minimum: 1 }
        title: { type: string }
        subtitle: { type: string }
        route: { type: string }
    EventReadiness:
      type: object
      required: [eventId, progress, completed, total, isComplete, steps]
      properties:
        eventId: { type: string, format: uuid }
        progress: { type: number, minimum: 0, maximum: 1 }
        completed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        isComplete: { type: boolean }
        nextAction:
          oneOf:
            - $ref: "#/components/schemas/EventReadinessStep"
            - type: "null"
        steps:
          type: array
          items: { $ref: "#/components/schemas/EventReadinessStep" }
    ChecklistItem:
      type: object
      required: [id, eventId, title, displayOrder, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 1000 }
        assigneeName: { type: [string, "null"], maxLength: 120 }
        timezone: { type: string, maxLength: 64 }
        assigneeType: { type: string, enum: [SELF, GUEST, NONE] }
        assigneeUserId: { type: [string, "null"], format: uuid }
        assigneeGuestId: { type: [string, "null"], format: uuid }
        dueDate: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        displayOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChecklistItemWrite:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: [string, "null"], format: date-time }
        completed: { type: boolean }
        displayOrder: { type: integer, minimum: 0 }
    BudgetItem:
      type: object
      required:
        [
          id,
          eventId,
          category,
          description,
          plannedAmount,
          paid,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        category: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 200 }
        plannedAmount: { type: number, minimum: 0, maximum: 99999999.99 }
        actualAmount:
          { type: [number, "null"], minimum: 0, maximum: 99999999.99 }
        paid: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BudgetItemWrite:
      type: object
      properties:
        category: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 200 }
        plannedAmount: { type: number, minimum: 0, maximum: 99999999.99 }
        actualAmount:
          { type: [number, "null"], minimum: 0, maximum: 99999999.99 }
        paid: { type: boolean }
    EventPlanning:
      type: object
      required: [eventId, checklist, checklistSummary, budget, budgetSummary]
      properties:
        eventId: { type: string, format: uuid }
        timezone: { type: string, maxLength: 64, example: America/Sao_Paulo }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        checklistSummary:
          type: object
          required: [total, completed]
          properties:
            total: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
        budget:
          type: array
          items: { $ref: "#/components/schemas/BudgetItem" }
        budgetSummary:
          type: object
          required: [plannedTotal, actualTotal, remaining, paidItems]
          properties:
            plannedTotal: { type: number }
            actualTotal: { type: number }
            remaining: { type: number }
            paidItems: { type: integer, minimum: 0 }
    Guest:
      type: object
      required: [id, eventId, name, rsvpStatus]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        rsvpStatus:
          type: string
          enum: [PENDING, CONFIRMED, DECLINED, MAYBE]
        participationMode:
          type: [string, "null"]
          enum: [IN_PERSON, VIRTUAL, null]
        adultCount: { type: integer, minimum: 0 }
        adultsCount:
          type: integer
          minimum: 0
          deprecated: true
          description: Alias legado. O contrato vigente usa adultCount.
        childrenCount: { type: integer, minimum: 0 }
        guestCount:
          type: integer
          minimum: 0
          description: Total informado para o convite. O limite do plano considera o maior valor entre este total, adultos + crianças e uma pessoa por convite ativo.
        isVip: { type: boolean }
        dietaryRestrictions: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        respondedAt: { type: [string, "null"], format: date-time }
        inviteSentAt: { type: [string, "null"], format: date-time }
        active: { type: boolean }
        publicSession:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GuestPublicSession"
    GuestPublicSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          minLength: 40
          writeOnly: true
        expiresAt: { type: string, format: date-time }
    CreateGuest:
      type: object
      required: [eventId, name]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        adultCount: { type: integer, minimum: 0 }
        adultsCount:
          type: integer
          minimum: 0
          deprecated: true
          description: Alias legado. O contrato vigente usa adultCount.
        childrenCount: { type: integer, minimum: 0 }
        guestCount:
          type: integer
          minimum: 0
          description: Total informado para o convite. O limite do plano considera o maior valor entre este total, adultos + crianças e uma pessoa por convite ativo.
        isVip: { type: boolean }
    ImportGuest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        adultCount: { type: integer, minimum: 0 }
        childrenCount: { type: integer, minimum: 0 }
        guestCount:
          type: integer
          minimum: 1
          description: Total informado para o convite. Acompanhantes também consomem o limite de pessoas do plano.
        isVip: { type: boolean }
        dietaryRestrictions: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    GiftCategory:
      type: string
      enum: [DIAPERS, HYGIENE, BATH, CLOTHING, FEEDING, ROOM, TOYS, OTHER]
    GiftCart:
      type: object
      required:
        [
          id,
          eventId,
          guestId,
          status,
          items,
          itemCount,
          giftExperience,
          canCheckoutPix,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        status:
          { type: string, enum: [ACTIVE, CHECKED_OUT, ABANDONED, EXPIRED] }
        itemCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        expiresAt: { type: [string, "null"], format: date-time }
        canCheckoutPix: { type: boolean }
        canCheckoutShipToHost:
          type: boolean
          description: Indica se o checkout SHIP_TO_HOST pode ser iniciado; nunca contém o endereço.
        giftExperience:
          type: object
          required: [preference, allowPix, allowPhysical, allowShipToHost, nudgeEnabled]
          properties:
            preference:
              type: string
              enum: [BALANCED, PREFER_PIX, PREFER_PHYSICAL]
            allowPix: { type: boolean }
            allowPhysical: { type: boolean }
            allowShipToHost:
              type: boolean
              description: Elegibilidade atual; não expõe o endereço do anfitrião.
            nudgeEnabled: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [id, giftId, quantity]
            properties:
              id: { type: string, format: uuid }
              giftId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              gift: { $ref: "#/components/schemas/Gift" }
    GiftCheckout:
      type: object
      required: [id, eventId, guestId, mode, status, items]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        mode: { type: string, enum: [PHYSICAL, PIX, SHIP_TO_HOST] }
        status:
          type: string
          enum:
            [
              PENDING,
              AWAITING_PAYMENT,
              UNDER_REVIEW,
              CONFIRMED,
              REJECTED,
              CANCELED,
              EXPIRED,
            ]
        totalAmount: { type: [number, "null"] }
        expiresAt: { type: [string, "null"], format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        receivedAt: { type: [string, "null"], format: date-time }
        reviewReason: { type: [string, "null"] }
        receipt:
          type: object
          required: [uploaded]
          properties:
            uploaded: { type: boolean }
            mimeType: { type: [string, "null"] }
            uploadedAt: { type: [string, "null"], format: date-time }
        shipping:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HostDeliveryAddressSnapshot"
        timeline:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                  [
                    CREATED,
                    RECEIPT_UPLOADED,
                    CORRECTED,
                    APPROVED,
                    REJECTED,
                    CANCELED,
                    REFUNDED,
                    EXPIRED,
                    RECEIVED,
                  ]
              previousStatus: { type: [string, "null"] }
              nextStatus: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        pix:
          oneOf:
            - type: "null"
            - type: object
              required: [key, receiverName]
              properties:
                key: { type: string }
                receiverName: { type: [string, "null"] }
                bankName: { type: [string, "null"] }
        items:
          type: array
          items:
            type: object
            required: [giftId, titleSnapshot, quantity]
            properties:
              id: { type: string, format: uuid }
              giftId: { type: string, format: uuid }
              titleSnapshot: { type: string }
              quantity: { type: integer, minimum: 1 }
              unitAmount: { type: [number, "null"] }
              totalAmount: { type: [number, "null"] }
              gift:
                oneOf:
                  - type: "null"
                  - type: object
                    properties:
                      imageUrl: { type: [string, "null"] }
                      category:
                        oneOf:
                          - $ref: "#/components/schemas/GiftCategory"
                          - type: "null"
                      description: { type: [string, "null"] }
                      quantityUnit: { type: [string, "null"] }
    GiftCheckoutReceiptUpload:
      type: object
      required: [checkoutId, uploadUrl, storageKey, receiptToken, expiresAt]
      properties:
        checkoutId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        storageKey: { type: string }
        receiptToken: { type: string }
        expiresAt: { type: string, format: date-time }
    TelemetrySummary:
      type: object
      required:
        [windowMinutes, totalEvents, byEvent, funnel, checkout, billing, alerts]
      properties:
        windowMinutes: { type: integer }
        totalEvents: { type: integer }
        byEvent: { type: object, additionalProperties: { type: integer } }
        apiErrorsByEndpoint:
          type: object
          additionalProperties: { type: integer }
        api5xxByEndpoint:
          type: object
          additionalProperties: { type: integer }
        funnel: { type: object, additionalProperties: true }
        checkout: { type: object, additionalProperties: true }
        billing:
          type: object
          required:
            [
              statuses,
              reconciliationCompleted,
              reconciliationFailures,
              reconciliationJobFailures,
            ]
          properties:
            statuses:
              type: object
              additionalProperties: { type: integer }
            reconciliationCompleted: { type: integer }
            reconciliationFailures: { type: integer }
            reconciliationJobFailures: { type: integer }
        alerts:
          type: array
          items:
            type: object
            required: [code, value, threshold, severity]
            properties:
              code: { type: string }
              value: { type: number }
              threshold: { type: number }
              severity: { type: string, enum: [warning, critical] }
    OrganizerGiftCheckout:
      allOf:
        - $ref: "#/components/schemas/GiftCheckout"
        - type: object
          properties:
            receiptAvailable: { type: boolean }
            guest:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: [string, "null"], format: email }
    GiftCheckoutPreview:
      type: object
      required:
        [cartId, cartVersion, mode, itemCount, currency, canCheckout, conflicts]
      properties:
        cartId: { type: string, format: uuid }
        cartVersion: { type: integer, minimum: 1 }
        mode: { type: string, enum: [PHYSICAL, PIX, SHIP_TO_HOST] }
        itemCount: { type: integer, minimum: 1 }
        totalAmount: { type: [number, "null"] }
        currency: { type: string, enum: [BRL] }
        canCheckout: { type: boolean }
        cartExpiresAt: { type: [string, "null"], format: date-time }
        checkoutExpiresAt: { type: [string, "null"], format: date-time }
        conflicts:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              itemId: { type: [string, "null"], format: uuid }
              giftId: { type: [string, "null"], format: uuid }
              code:
                type: string
                enum: [GIFT_UNAVAILABLE, INSUFFICIENT_QUANTITY, AMOUNT_REQUIRED]
              message: { type: string }
              requestedQuantity: { type: integer, minimum: 1 }
              availableQuantity: { type: integer, minimum: 0 }
    HostDeliveryAddressSnapshot:
      type: object
      additionalProperties: false
      required: [recipientName, street, number, district, city, state, zipCode]
      properties:
        recipientName: { type: string }
        street: { type: string }
        number: { type: string }
        complement: { type: [string, "null"] }
        district: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: string }
        reference: { type: [string, "null"] }
    Gift:
      type: object
      required: [id, eventId, title, category, isCollective, status]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: "#/components/schemas/GiftCategory" }
        description: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        purchaseUrl: { type: [string, "null"] }
        targetAmount: { type: [number, "null"] }
        isCollective: { type: boolean }
        status: { type: string, enum: [AVAILABLE, PARTIAL, RESERVED, FUNDED] }
        quantityTarget: { type: integer, minimum: 1 }
        quantityUnit: { type: string, minLength: 1 }
        diaperGoalId: { type: [string, "null"], format: uuid }
        quantityReserved: { type: integer, minimum: 0 }
        quantityReceived: { type: integer, minimum: 0 }
        receivedAt: { type: [string, "null"], format: date-time }
        thankYouSentAt: { type: [string, "null"], format: date-time }
        displayOrder: { type: integer, minimum: 0 }
        active: { type: boolean }
        contributedTotal: { type: [number, "null"] }
        progress: { type: [number, "null"] }
        reservedByName: { type: [string, "null"] }
        reservation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GiftReservation"
        reservations:
          type: array
          items: { $ref: "#/components/schemas/GiftReservation" }
        contributions:
          type: array
          items: { $ref: "#/components/schemas/GiftContribution" }
    GiftReservation:
      type: object
      required: [id, guestName]
      properties:
        id: { type: string, format: uuid }
        guestName: { type: string }
        guestId: { type: [string, "null"], format: uuid }
        guestEmail: { type: [string, "null"], format: email }
        message: { type: [string, "null"] }
        reservedAt: { type: [string, "null"], format: date-time }
    GiftContribution:
      type: object
      required: [id, contributorName]
      properties:
        id: { type: string, format: uuid }
        contributorName: { type: string }
        isAnonymous: { type: boolean }
        paymentStatus: { type: [string, "null"] }
        contributorEmail: { type: [string, "null"], format: email }
        amount: { type: number }
        identifiedAmount: { type: [number, "null"] }
        message: { type: [string, "null"] }
        contributedAt: { type: [string, "null"], format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        hasReceipt: { type: boolean }
        receiptStorageKey: { type: [string, "null"] }
        auditLogs:
          type: array
          items: { $ref: "#/components/schemas/ContributionAuditLog" }
    ContributionAuditLog:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        createdAt: { type: string, format: date-time }
        reason: { type: [string, "null"] }
        previousStatus: { type: [string, "null"] }
        nextStatus: { type: [string, "null"] }
        previousAmount: { type: [number, "null"] }
        nextAmount: { type: [number, "null"] }
    ManagedGiftReservation:
      type: object
      required:
        [id, giftId, giftTitle, eventId, eventTitle, eventDateTime, reservedAt]
      properties:
        id: { type: string, format: uuid }
        giftId: { type: string, format: uuid }
        giftTitle: { type: string }
        giftImageUrl: { type: [string, "null"] }
        giftCategory:
          oneOf:
            - $ref: "#/components/schemas/GiftCategory"
            - type: "null"
        giftDescription: { type: [string, "null"] }
        quantityUnit: { type: [string, "null"] }
        purchaseUrl: { type: [string, "null"] }
        eventId: { type: string, format: uuid }
        eventTitle: { type: string }
        eventDateTime: { type: string, format: date-time }
        eventTimezone: { type: string }
        reservedAt: { type: string, format: date-time }
        purchasedAt: { type: [string, "null"], format: date-time }
    CreateGift:
      type: object
      required: [eventId, title]
      properties:
        eventId: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: "#/components/schemas/GiftCategory" }
        description: { type: string }
        imageUrl: { type: string }
        purchaseUrl: { type: string, format: uri }
        isCollective: { type: boolean, default: false }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        quantityTarget: { type: integer, minimum: 1, default: 1 }
        quantityUnit: { type: string, minLength: 1, default: unidade }
