  /care/patients/{patientUserId}/physio/plans:
    post:
      tags: [Care]
      operationId: createPhysioCarePlan
      description: Cria um plano funcional quando o vínculo possui physio.plan.write.
      parameters: [{ $ref: "#/components/parameters/PatientUserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals, exercises, startsAt]
              properties:
                goals:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                exercises:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: true
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Plano fisioterapêutico criado }
        "403": { $ref: "#/components/responses/Forbidden" }
  /care/patients/{patientUserId}/physio/sessions:
    post:
      tags: [Care]
      operationId: createPhysioSession
      description: Registra somente evolução funcional; medições obstétricas são rejeitadas.
      parameters: [{ $ref: "#/components/parameters/PatientUserId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                carePlanId: { type: string, format: uuid, nullable: true }
                scheduledAt: { type: string, format: date-time }
                status:
                  type: string
                  enum: [SCHEDULED, COMPLETED, CANCELED, MISSED]
                notes: { type: string }
                measurements:
                  type: object
                  nullable: true
                  additionalProperties: false
                  properties:
                    painScore: { type: number, minimum: 0, maximum: 10 }
                    discomfortScore: { type: number, minimum: 0, maximum: 10 }
                    mobilityScore: { type: number, minimum: 0, maximum: 10 }
                    perceivedEffort: { type: number, minimum: 0, maximum: 10 }
                    adherencePercent: { type: number, minimum: 0, maximum: 100 }
                    symptoms: { type: string, maxLength: 2000 }
      responses:
        "201": { description: Sessão ou evolução funcional registrada }
        "403": { $ref: "#/components/responses/Forbidden" }
